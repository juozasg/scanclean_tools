[project]
name = "scanclean-tools"
version = "0.1.0"
description = "Turn phone photos of book and journal pages into flat greyscale scans"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "img2pdf>=0.6.3",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
scanclean = "scanclean_tools.run_all:main"
scanclean-dewarp = "scanclean_tools.step1_dewarp:main"
scanclean-tone = "scanclean_tools.step2_tone:main"
scanclean-grid = "scanclean_tools.step2b_grid:main"
scanclean-pdf = "scanclean_tools.step3_pdf:main"
dewarp-tool = "scanclean_tools.dewarp_tool:main"
grid-tool = "scanclean_tools.grid_tool:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
